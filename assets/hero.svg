<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 880 340" width="880" height="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>left, your screen: a chat, a mail inbox and an editor with an api key, an email, a phone number and an ip address. right, what the call sees: the chat and the inbox blurred, the editor sharp, and the four values covered by solid boxes.</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3550"/>
      <stop offset="1" stop-color="#1d2230"/>
    </linearGradient>
    <clipPath id="screen"><rect width="390" height="244" rx="10"/></clipPath>
    <filter id="blur" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/></filter>

    <!-- everything but the focused app -->
    <g id="desktop">
      <rect width="390" height="244" fill="url(#wall)"/>
      <rect width="390" height="14" fill="#000" opacity="0.35"/>
      <circle cx="12" cy="7" r="3" fill="#fff" opacity="0.7"/>
      <rect x="22" y="5" width="18" height="4" rx="2" fill="#fff" opacity="0.5"/>
      <rect x="46" y="5" width="14" height="4" rx="2" fill="#fff" opacity="0.35"/>
      <rect x="340" y="5" width="38" height="4" rx="2" fill="#fff" opacity="0.5"/>

      <!-- chat -->
      <g filter="url(#shadow)">
        <rect x="14" y="28" width="160" height="196" rx="7" fill="#2b2d38"/>
      </g>
      <rect x="14" y="28" width="160" height="18" rx="7" fill="#353847"/>
      <rect x="14" y="40" width="160" height="6" fill="#353847"/>
      <circle cx="24" cy="37" r="2.5" fill="#ff5f57"/><circle cx="32" cy="37" r="2.5" fill="#febc2e"/><circle cx="40" cy="37" r="2.5" fill="#28c840"/>
      <text x="94" y="40" font-size="8" fill="#c9cbd6" text-anchor="middle"># payments</text>
      <g font-size="7.5">
        <circle cx="28" cy="62" r="6" fill="#e07a5f"/>
        <text x="40" y="60" fill="#fff" font-weight="600">jamie</text>
        <text x="40" y="70" fill="#c9cbd6">refund for Maria Lopez?</text>
        <circle cx="28" cy="92" r="6" fill="#81b29a"/>
        <text x="40" y="90" fill="#fff" font-weight="600">sam</text>
        <text x="40" y="100" fill="#c9cbd6">card ends 4821, sent</text>
        <circle cx="28" cy="122" r="6" fill="#f2cc8f"/>
        <text x="40" y="120" fill="#fff" font-weight="600">lee</text>
        <text x="40" y="130" fill="#c9cbd6">salary sheet is in drive</text>
        <circle cx="28" cy="152" r="6" fill="#e07a5f"/>
        <text x="40" y="150" fill="#fff" font-weight="600">jamie</text>
        <text x="40" y="160" fill="#c9cbd6">thx, closing the ticket</text>
      </g>
      <rect x="22" y="202" width="144" height="14" rx="4" fill="#3b3e4d"/>

      <!-- mail -->
      <g filter="url(#shadow)">
        <rect x="236" y="24" width="142" height="128" rx="7" fill="#f4f4f6"/>
      </g>
      <rect x="236" y="24" width="142" height="18" rx="7" fill="#e3e3e8"/>
      <rect x="236" y="36" width="142" height="6" fill="#e3e3e8"/>
      <circle cx="246" cy="33" r="2.5" fill="#ff5f57"/><circle cx="254" cy="33" r="2.5" fill="#febc2e"/><circle cx="262" cy="33" r="2.5" fill="#28c840"/>
      <text x="314" y="36" font-size="8" fill="#555" text-anchor="middle">Inbox</text>
      <g font-size="7">
        <text x="290" y="56" fill="#222" font-weight="600">Dr. Kim's office</text>
        <text x="290" y="65" fill="#777">your test results are…</text>
        <text x="290" y="80" fill="#222" font-weight="600">Landlord</text>
        <text x="290" y="89" fill="#777">lease renewal, unit 4B</text>
        <text x="290" y="104" fill="#222" font-weight="600">Bank</text>
        <text x="290" y="113" fill="#777">statement for 9921-…</text>
      </g>
    </g>
  </defs>

  <rect width="880" height="340" rx="16" fill="#111318"/>

  <!-- your screen -->
  <g transform="translate(24 30)">
    <g clip-path="url(#screen)">
      <use xlink:href="#desktop"/>
      <use xlink:href="#editor"/>
    </g>
    <rect width="390" height="244" rx="10" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="195" y="274" font-size="14" fill="#e6e7ec" text-anchor="middle" font-weight="600">your screen</text>
    <text x="195" y="293" font-size="11.5" fill="#8b8f9c" text-anchor="middle">presenting the editor</text>
  </g>

  <!-- arrow -->
  <g transform="translate(440 152)">
    <path d="M -10 0 H 10 M 4 -6 L 10 0 L 4 6" stroke="#8b8f9c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- what the call sees -->
  <g transform="translate(466 30)">
    <g clip-path="url(#screen)">
      <use xlink:href="#desktop" filter="url(#blur)"/>
      <rect width="390" height="244" fill="#111318" opacity="0.15"/>
      <g>
        <use xlink:href="#editor-frame"/>
        <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#d7dae0">
          <text x="110" y="104" fill="#6a7080"># staging</text>
          <text x="110" y="120"><tspan fill="#7fb4ff">DB_HOST</tspan>=</text>
          <rect x="157" y="112" width="55" height="11" rx="1.5" fill="#29292b" stroke="#ffffff" stroke-opacity="0.08"/>
          <text x="110" y="136"><tspan fill="#7fb4ff">STRIPE_KEY</tspan>=</text>
          <rect x="173" y="128" width="98" height="11" rx="1.5" fill="#29292b" stroke="#ffffff" stroke-opacity="0.08"/>
          <text x="110" y="152"><tspan fill="#7fb4ff">OWNER</tspan>=</text>
          <rect x="146" y="144" width="120" height="11" rx="1.5" fill="#29292b" stroke="#ffffff" stroke-opacity="0.08"/>
          <text x="110" y="168"><tspan fill="#7fb4ff">ONCALL</tspan>=</text>
          <rect x="152" y="160" width="72" height="11" rx="1.5" fill="#29292b" stroke="#ffffff" stroke-opacity="0.08"/>
          <text x="110" y="184"><tspan fill="#7fb4ff">REGION</tspan>=ap-northeast-2</text>
          <text x="110" y="200"><tspan fill="#7fb4ff">REPLICAS</tspan>=3</text>
        </g>
      </g>
    </g>
    <rect width="390" height="244" rx="10" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="195" y="274" font-size="14" fill="#e6e7ec" text-anchor="middle" font-weight="600">what the call sees</text>
    <text x="195" y="293" font-size="11.5" fill="#8b8f9c" text-anchor="middle">other apps blurred · secrets boxed · on device</text>
  </g>

  <!-- the focused app, used by both screens -->
  <defs>
    <g id="editor-frame">
      <g filter="url(#shadow)">
        <rect x="98" y="64" width="196" height="152" rx="7" fill="#16181e"/>
      </g>
      <rect x="98" y="64" width="196" height="18" rx="7" fill="#22252d"/>
      <rect x="98" y="76" width="196" height="6" fill="#22252d"/>
      <circle cx="108" cy="73" r="2.5" fill="#ff5f57"/><circle cx="116" cy="73" r="2.5" fill="#febc2e"/><circle cx="124" cy="73" r="2.5" fill="#28c840"/>
      <text x="196" y="76" font-size="8" fill="#a9adb9" text-anchor="middle">deploy.env</text>
      <rect x="98" y="64" width="196" height="152" rx="7" fill="none" stroke="#7fb4ff" stroke-opacity="0.55"/>
    </g>
    <g id="editor">
      <use xlink:href="#editor-frame"/>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#d7dae0">
        <text x="110" y="104" fill="#6a7080"># staging</text>
        <text x="110" y="120"><tspan fill="#7fb4ff">DB_HOST</tspan>=10.0.4.12</text>
        <text x="110" y="136"><tspan fill="#7fb4ff">STRIPE_KEY</tspan>=sk_live_51Hx9a…</text>
        <text x="110" y="152"><tspan fill="#7fb4ff">OWNER</tspan>=maria.lopez@gmail.com</text>
        <text x="110" y="168"><tspan fill="#7fb4ff">ONCALL</tspan>=010-4821-7730</text>
        <text x="110" y="184"><tspan fill="#7fb4ff">REGION</tspan>=ap-northeast-2</text>
        <text x="110" y="200"><tspan fill="#7fb4ff">REPLICAS</tspan>=3</text>
      </g>
    </g>
  </defs>
</svg>
